name: Build

# CI de build propre à MyGesClient, appelée par release.yml une fois le tag
# décodé par release-kit :
#   - Linux : .deb amd64 et arm64, un par version d'Ubuntu (input "ubuntu"),
#   - Windows : installeur NSIS + .exe portable, amd64 et arm64,
#   - macOS : .app universelle (Intel + Apple Silicon) zippée, non signée.
# Les livrables sont uploadés dans des artifacts "release-*", que release-kit
# joint à la release GitHub.
on:
  workflow_call:
    inputs:
      tag:          # v1.2.0_beta
        type: string
        required: true
      version:      # 1.2.0
        type: string
        required: true
      debversion:   # 1.2.0~beta
        type: string
        required: true
      ubuntu:
        # Une nouvelle Ubuntu = une entrée de plus ici (ex. "28.04"), rien d'autre.
        description: Versions d'Ubuntu pour lesquelles produire un .deb (liste JSON)
        type: string
        default: '["24.04", "26.04"]'

env:
  WAILS_VERSION: v2.17.1  # same version as github.com/wailsapp/wails/v2 in go.mod
  NODE_VERSION: '20'

jobs:
  linux:
    # Un .deb par (version d'Ubuntu × architecture). Le build tourne dans le
    # conteneur ubuntu:<version> : l'image Docker existe dès la sortie d'une
    # Ubuntu et le reste après le retrait du runner GitHub correspondant. Le
    # runner ne sert qu'à faire tourner Docker sur la bonne architecture.
    name: linux (ubuntu ${{ matrix.ubuntu }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(inputs.ubuntu) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
      VERSION: ${{ inputs.version }}
      # 1.2.0~beta+ubuntu26.04 > 1.2.0~beta+ubuntu24.04 : apt met le paquet à
      # jour proprement après une montée de version de l'OS.
      DEBVERSION: ${{ inputs.debversion }}+ubuntu${{ matrix.ubuntu }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Le conteneur est nu : outils requis par checkout/setup-* et les steps.
      - name: Outils de base
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl jq xz-utils

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dépendances système
        run: |
          apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      - name: Build
        # Ubuntu 24.04 ne fournit plus webkit2gtk-4.0
        run: wails build -tags webkit2_41

      - name: Paquet .deb
        run: |
          umask 022  # dpkg-deb exige des dossiers en 755
          app_id=io.github.spatulox.MyGesClient
          root=pkg
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications" \
                   "$root/usr/share/pixmaps"

          install -m 755 build/bin/MyGesClient "$root/usr/bin/MyGesClient"
          install -m 644 build/appicon.png "$root/usr/share/pixmaps/$app_id.png"

          cat > "$root/usr/share/applications/$app_id.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MyGesClient
          Comment=Unofficial Client for MyGES website
          Exec=/usr/bin/MyGesClient
          Icon=$app_id
          Terminal=false
          Categories=Education;
          StartupWMClass=$app_id
          EOF

          cat > "$root/DEBIAN/control" <<EOF
          Package: mygesclient
          Version: $DEBVERSION
          Section: education
          Priority: optional
          Architecture: $ARCH
          Maintainer: Spatulox
          Depends: libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0
          Suggests: gnome-keyring | kwalletmanager | keepassxc
          Homepage: https://github.com/Spatulox/MyGesClient
          Description: Unofficial Client for MyGES website
           Unofficial Client for MyGES website. Created with GO and Wails.
          EOF

          mkdir -p dist
          dpkg-deb --build --root-owner-group "$root" "dist/MyGesClient_${DEBVERSION}_${ARCH}.deb"
          dpkg-deb --info "dist/MyGesClient_${DEBVERSION}_${ARCH}.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NSIS
        run: |
          if [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      # One build per architecture: each one writes build/bin/MyGesClient.exe,
      # so the files are copied before the next build. Windows needs no CGO:
      # arm64 is cross-compiled from the x64 runner.
      - name: Build amd64
        run: |
          wails build -platform windows/amd64 -nsis
          mkdir -p dist
          cp build/bin/MyGesClient-amd64-installer.exe "dist/MyGesClient-${TAG}-setup.exe"
          cp build/bin/MyGesClient.exe "dist/MyGesClient-${TAG}-portable.exe"

      - name: Build arm64
        run: |
          rm -f build/bin/MyGesClient.exe
          wails build -platform windows/arm64 -nsis -s
          cp build/bin/MyGesClient-arm64-installer.exe "dist/MyGesClient-${TAG}-setup-arm64.exe"
          cp build/bin/MyGesClient.exe "dist/MyGesClient-${TAG}-portable-arm64.exe"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      - name: Tests macOS
        # The macOS only code (LaunchAgent of the background service) is only
        # tested here
        run: go test ./autostart/ ./service/

      - name: Build
        # Universal binary: Intel + Apple Silicon
        run: wails build -platform darwin/universal

      - name: Zip de l'application
        # Not signed nor notarized: see the README to open it the first time.
        # ditto keeps the bundle's symlinks and extended attributes.
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/MyGesClient.app "dist/MyGesClient-${TAG}-macos-universal.zip"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error

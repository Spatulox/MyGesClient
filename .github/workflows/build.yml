name: Build

# CI de build propre à MyGesClient, appelée par release.yml une fois le tag
# décodé par release-kit :
#   - Linux : .deb amd64 et arm64, un par version d'Ubuntu (input "ubuntu"),
#     construit par le workflow réutilisable de PackagingOnLinux d'après
#     packaging.toml, dans l'image .github/build.Dockerfile,
#   - Windows : installeur NSIS + .zip portable amd64, cross-compilés depuis
#     Linux et construits par PackagingOnLinux (même workflow),
#   - macOS : .app universelle (Intel + Apple Silicon) zippée, non signée.
# Les livrables sont uploadés dans des artifacts "release-*", que release-kit
# joint à la release GitHub.
on:
  workflow_call:
    inputs:
      tag:          # v1.2.0_beta
        type: string
        required: true
      version:      # 1.2.0
        type: string
        required: true
      debversion:   # 1.2.0~beta
        type: string
        required: true
      ubuntu:
        # Une nouvelle Ubuntu = une entrée de plus ici (ex. "28.04"), rien d'autre.
        description: Versions d'Ubuntu pour lesquelles produire un .deb (liste JSON)
        type: string
        default: '["24.04", "26.04"]'

env:
  WAILS_VERSION: v2.17.1  # same version as github.com/wailsapp/wails/v2 in go.mod
  NODE_VERSION: '20'

jobs:
  linux:
    # Un .deb par (version d'Ubuntu × architecture), construit par le workflow
    # réutilisable de PackagingOnLinux d'après packaging.toml, dans l'image
    # .github/build.Dockerfile basée sur ubuntu:<version> : les Depends détectés
    # (dpkg-shlibdeps) sont ceux de cette Ubuntu. La version affichée dans
    # l'app vient du tag (git describe dans wailsbuild.sh).
    name: linux (ubuntu ${{ matrix.ubuntu }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(inputs.ubuntu) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@v0
    with:
      formats: deb
      # 1.2.0~beta+ubuntu26.04 > 1.2.0~beta+ubuntu24.04 : apt met le paquet à
      # jour proprement après une montée de version de l'OS.
      version: ${{ inputs.debversion }}+ubuntu${{ matrix.ubuntu }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=ubuntu:${{ matrix.ubuntu }}
      runs-on: ${{ matrix.runner }}
      artifact-name: release-linux-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}

  windows:
    # Comme APITester : Wails cross-compile l'exe Windows depuis Linux
    # ([windows] command de packaging.toml, wailsbuild.sh), puis PackagingOnLinux
    # en fait l'installeur NSIS (par utilisateur, sans admin) et le .zip portable.
    uses: Spatulox/PackagingOnLinux/.github/workflows/package.yml@v0
    with:
      formats: zip,nsis
      version: ${{ inputs.debversion }}
      dockerfile: .github/build.Dockerfile
      build-args: BASE=ubuntu:24.04
      artifact-name: release-windows

  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      - name: Tests macOS
        # The macOS only code (LaunchAgent of the background service) is only
        # tested here
        run: go test ./autostart/ ./service/

      - name: Build
        # Universal binary: Intel + Apple Silicon
        run: wails build -platform darwin/universal -ldflags "-X MyGesClient/backend.AppVersion=${TAG}"

      - name: Zip de l'application
        # Not signed nor notarized: see the README to open it the first time.
        # ditto keeps the bundle's symlinks and extended attributes.
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/MyGesClient.app "dist/MyGesClient-${TAG}-macos-universal.zip"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error

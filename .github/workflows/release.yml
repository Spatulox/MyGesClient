name: Release

# Pousser un tag vX.Y.Z_beta, vX.Y.Z_rc ou vX.Y.Z_release (ou vX.Y.Z) :
# build Linux (.deb) + Windows (installeur NSIS + .exe portable),
# puis création de la release GitHub avec la section du CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  WAILS_VERSION: v2.10.1
  NODE_VERSION: '20'

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      debversion: ${{ steps.parse.outputs.debversion }}
    steps:
      - id: parse
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(_(beta|rc|release))?$ ]]; then
            echo "::error::Tag '$tag' invalide (attendu : vX.Y.Z_beta, vX.Y.Z_rc, vX.Y.Z_release ou vX.Y.Z)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          channel="${BASH_REMATCH[3]:-release}"
          if [ "$channel" = release ]; then
            prerelease=false; debversion="$version"
          else
            # "~" : dpkg classe 1.2.0~beta < 1.2.0~rc < 1.2.0
            prerelease=true; debversion="${version}~${channel}"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "debversion=$debversion"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: meta
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      DEBVERSION: ${{ needs.meta.outputs.debversion }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      - name: Build
        # Ubuntu 24.04 ne fournit plus webkit2gtk-4.0
        run: wails build -tags webkit2_41

      - name: Paquet .deb
        run: |
          umask 022  # dpkg-deb exige des dossiers en 755
          app_id=io.github.spatulox.MyGesClient
          root=pkg
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications" \
                   "$root/usr/share/pixmaps"

          install -m 755 build/bin/MyGesClient "$root/usr/bin/MyGesClient"
          install -m 644 build/appicon.png "$root/usr/share/pixmaps/$app_id.png"

          cat > "$root/usr/share/applications/$app_id.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=MyGesClient
          Comment=Unofficial Client for MyGES website
          Exec=/usr/bin/MyGesClient
          Icon=$app_id
          Terminal=false
          Categories=Education;
          EOF

          cat > "$root/DEBIAN/control" <<EOF
          Package: mygesclient
          Version: $DEBVERSION
          Section: education
          Priority: optional
          Architecture: amd64
          Maintainer: Spatulox
          Depends: libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0
          Homepage: https://github.com/Spatulox/MyGesClient
          Description: Unofficial Client for MyGES website
           Unofficial Client for MyGES website. Created with GO and Wails.
          EOF

          mkdir -p dist
          dpkg-deb --build --root-owner-group "$root" "dist/MyGesClient_${DEBVERSION}_amd64.deb"
          dpkg-deb --info "dist/MyGesClient_${DEBVERSION}_amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NSIS
        run: |
          if [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Version dans wails.json
        run: |
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp.json
          mv wails.tmp.json wails.json

      - name: Build
        run: wails build -platform windows/amd64 -nsis

      - name: Renommer les livrables
        run: |
          mkdir -p dist
          cp build/bin/MyGesClient-amd64-installer.exe "dist/MyGesClient-${TAG}-setup.exe"
          cp build/bin/MyGesClient.exe "dist/MyGesClient-${TAG}-portable.exe"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [meta, linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Notes depuis CHANGELOG.md
        run: |
          if ! bash .github/scripts/changelog.sh "$TAG" > notes.md; then
            echo "::warning::Pas de section '## $TAG' dans CHANGELOG.md"
            echo "Pas de notes de version pour $TAG." > notes.md
          fi
          cat notes.md

      - name: Release GitHub
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Relance du workflow : met à jour la release existante
            gh release edit "$TAG" --notes-file notes.md --prerelease="$PRERELEASE"
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--title "MyGesClient $TAG" --notes-file notes.md --verify-tag)
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease --latest=false)
            else
              flags+=(--latest)
            fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi

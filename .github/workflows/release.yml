name: Release

# Pousser un tag vX.Y.Z_alpha, vX.Y.Z_beta, vX.Y.Z_rc ou vX.Y.Z_release (ou vX.Y.Z) :
#   1. release-kit décode le tag,
#   2. build.yml construit Linux (.deb) + Windows (installeur NSIS + .exe portable),
#      en amd64 et arm64, et macOS (.app universelle zippée, non signée),
#   3. release-kit crée la release GitHub avec la section du CHANGELOG.md.
# Voir https://github.com/Spatulox/release-kit
on:
  push:
    tags: ['v*']
  # « Run workflow » (onglet Actions) : build à blanc, tout est construit, rien n'est publié.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    uses: Spatulox/release-kit/.github/workflows/tag.yml@v1
    with:
      # Échoue tout de suite, avant le build, sans section du tag dans CHANGELOG.md.
      require-changelog: true

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      debversion: ${{ needs.tag.outputs.debversion }}

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.dry-run != 'true'
    uses: Spatulox/release-kit/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
      title: MyGesClient ${{ needs.tag.outputs.tag }}

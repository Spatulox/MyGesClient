# Generated by PackagingOnLinux. Paths are relative to this file.

[app]
id = "io.github.spatulox.MyGesClient"
name = "MyGesClient"
version = "1.3.2"
summary = "Unofficial Client for MyGES website. Created with GO and Wails"
description = "Unofficial Client for MyGES website. Created with GO and Wails"
license = "GPL-3.0-or-later"
maintainer = "Spatulox"
homepage = "https://github.com/Spatulox/MyGesClient"
categories = ["Education"]

[linux]
command = "bash wailsbuild.sh"
binary = "build/bin/MyGesClient"
icon = "build/appicon.png"
# WM_CLASS of the window (xprop WM_CLASS): the binary name, not the app id.
# Wails 2 applies Linux.ProgramName (main.go) after gtk_init, too late for
# WM_CLASS. Without StartupWMClass, GNOME shows a generic icon in the dock.
wm_class = "MyGesClient"

[windows]
command = "bash wailsbuild.sh -platform windows/amd64"
binary = "build/bin/MyGesClient.exe"
icon = "build/windows/icon.ico"

[deps]
# Depends: detected from the binary (dpkg-shlibdeps), per Ubuntu release in the CI.
# The OS keyring stores the MyGes password; without one it stays in the local DB.
deb_suggests = ["gnome-keyring | kwalletmanager | keepassxc"]
rpm_suggests = ["(gnome-keyring or kwalletmanager or keepassxc)"]

# The version above is replaced by the release tag in the CI (.github/workflows/build.yml).

[output]
formats = ["deb", "rpm", "zip", "nsis"]
dir = "dist"
